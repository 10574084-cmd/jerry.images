name: Export Jerry PNG textures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-textures:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Jerry mod
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/10574084-cmd/jerry.images/releases/download/Chatgpt/jerry.jar.jar" \
            -o jerry.jar.jar

      - name: Export textures through the mod resource API
        run: |
          cat > ExportJerryTextures.java <<'JAVA'
          import java.io.InputStream;
          import java.lang.reflect.InvocationTargetException;
          import java.lang.reflect.Method;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.Set;

          public class ExportJerryTextures {
              public static void main(String[] args) throws Exception {
                  Class<?> loader = Class.forName("com.pkfl.jerry.internal.ygccompvajplugdbzp");
                  Method catalogMethod = loader.getMethod("catalog");
                  Method resourceMethod = loader.getMethod("resource", String.class);

                  @SuppressWarnings("unchecked")
                  Set<String> catalog = (Set<String>) catalogMethod.invoke(null);

                  List<String> entries = new ArrayList<>(catalog);
                  Collections.sort(entries);

                  Path output = Path.of("jerry-textures");
                  int exported = 0;
                  int failed = 0;

                  for (String identity : entries) {
                      if (!identity.startsWith("textures/") || !identity.toLowerCase().endsWith(".png")) {
                          continue;
                      }

                      try (InputStream in = (InputStream) resourceMethod.invoke(null, identity)) {
                          byte[] png = in.readAllBytes();
                          byte[] signature = new byte[] {
                              (byte) 0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a
                          };

                          if (png.length < 8) {
                              throw new IllegalStateException("Resource is too short to be a PNG");
                          }
                          for (int i = 0; i < signature.length; i++) {
                              if (png[i] != signature[i]) {
                                  throw new IllegalStateException("Resource did not decode to PNG");
                              }
                          }

                          String relative = identity.substring("textures/".length());
                          Path destination = output.resolve(relative).normalize();
                          if (!destination.startsWith(output)) {
                              throw new IllegalStateException("Unsafe output path");
                          }
                          Files.createDirectories(destination.getParent());
                          Files.write(destination, png);
                          exported++;
                          System.out.println("EXPORTED " + identity + " (" + png.length + " bytes)");
                      } catch (InvocationTargetException e) {
                          failed++;
                          Throwable cause = e.getCause() == null ? e : e.getCause();
                          System.err.println("FAILED " + identity + ": " + cause);
                      } catch (Exception e) {
                          failed++;
                          System.err.println("FAILED " + identity + ": " + e);
                      }
                  }

                  System.out.println("Catalog entries: " + catalog.size());
                  System.out.println("PNG textures exported: " + exported);
                  System.out.println("PNG textures failed: " + failed);

                  if (exported == 0) {
                      throw new IllegalStateException("No Jerry PNG textures were exported");
                  }
              }
          }
          JAVA

          javac -cp jerry.jar.jar ExportJerryTextures.java
          java -cp "jerry.jar.jar:." ExportJerryTextures

      - name: Create ZIP containing only PNG files
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("jerry-textures")
          files = sorted(root.rglob("*.png"))
          if not files:
              raise SystemExit("No PNG files found; refusing to create an empty ZIP")

          with ZipFile("jerry-textures.zip", "w", compression=ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.relative_to(root).as_posix())

          print(f"Created jerry-textures.zip with {len(files)} PNG files")
          PY

      - name: Upload Jerry PNG ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jerry-png-textures
          path: jerry-textures.zip
          if-no-files-found: error
          retention-days: 14
