name: Extract Jerry entity textures (Forge 1.20.1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-and-extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download the Chatgpt release asset
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/10574084-cmd/jerry.images/releases/download/Chatgpt/jerry.jar.jar" \
            -o jerry.jar.jar

      - name: Inspect Forge mod resources
        run: |
          python - <<'PY'
          from zipfile import ZipFile, BadZipFile
          from pathlib import Path
          import re

          jar = Path("jerry.jar.jar")
          report = []
          needles = ("jerry", "entity", "texture", "model", "geo", "skin", "assets", "movie")
          try:
              with ZipFile(jar) as z:
                  entries = z.infolist()
                  report.append(f"JAR size: {jar.stat().st_size} bytes")
                  report.append(f"Total entries: {len(entries)}")
                  report.append("\n=== ALL RESOURCE-LIKE PATHS ===")
                  for e in entries:
                      n = e.filename
                      low = n.lower()
                      if (low.startswith("assets/") or low.startswith("data/")
                          or low.endswith(("mods.toml", "pack.mcmeta", ".png", ".png.mcmeta",
                                           ".jpg", ".jpeg", ".webp", ".tga", ".json", ".mcmeta"))
                          or any(k in low for k in needles)):
                          report.append(f"{e.file_size:>12} bytes  {n}")
                  report.append("\n=== JERRY / ENTITY / MODEL / TEXTURE REFERENCES IN CLASS AND TEXT FILES ===")
                  hits = 0
                  for e in entries:
                      if e.is_dir() or not e.filename.lower().endswith((".class", ".json", ".toml", ".properties", ".txt")):
                          continue
                      try:
                          raw = z.read(e)
                      except Exception:
                          continue
                      strings = re.findall(rb"[ -~]{4,}", raw)
                      matches = [s.decode("utf-8", "replace") for s in strings
                                 if any(k.encode() in s.lower() for k in needles)]
                      if matches:
                          report.append(f"\n[{e.filename}]")
                          for s in matches[:80]:
                              report.append("  " + s[:500])
                              hits += 1
                  report.append(f"\nTotal matching strings: {hits}")
          except BadZipFile:
              raise SystemExit("The release asset is not a readable JAR/ZIP.")
          Path("jerry-diagnostic.txt").write_text("\n".join(report), encoding="utf-8")
          print("\n".join(report[:100]))
          print("\nFull report saved as jerry-diagnostic.txt")
          PY

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: jerry-diagnostic
          path: jerry-diagnostic.txt
          if-no-files-found: error
          retention-days: 7

      - name: Extract PNG images from archive entries
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile, ZIP_DEFLATED
          from io import BytesIO
          import base64, hashlib, re

          OUT = Path("png_images")
          OUT.mkdir(exist_ok=True)
          SIG = bytes([137, 80, 78, 71, 13, 10, 26, 10])
          seen = set()
          count = 0
          scanned = 0

          def save_png(data, label):
              global count
              if not data.startswith(SIG):
                  return
              pos = 8
              while pos + 12 <= len(data):
                  length = int.from_bytes(data[pos:pos+4], "big")
                  end = pos + 12 + length
                  if end > len(data):
                      return
                  kind = data[pos+4:pos+8]
                  pos = end
                  if kind == b"IEND":
                      png = data[:pos]
                      digest = hashlib.sha256(png).hexdigest()
                      if digest in seen:
                          return
                      seen.add(digest)
                      safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", label).strip("._") or "image"
                      (OUT / f"{count+1:04d}_{safe}.png").write_bytes(png)
                      count += 1
                      return

          def scan_bytes(data, label):
              start = 0
              while True:
                  pos = data.find(SIG, start)
                  if pos < 0:
                      break
                  save_png(data[pos:], f"{label}_embedded_{pos}")
                  start = pos + len(SIG)
              for match in re.finditer(rb"[A-Za-z0-9+/]{256,}={0,2}", data):
                  token = match.group(0)
                  if len(token) <= 40_000_000:
                      try:
                          decoded = base64.b64decode(token, validate=False)
                          if decoded.startswith(SIG):
                              save_png(decoded, f"{label}_base64_{match.start()}")
                      except Exception:
                          pass

          def scan_archive(blob, prefix=""):
              global scanned
              with ZipFile(BytesIO(blob)) as archive:
                  for item in archive.infolist():
                      if item.is_dir():
                          continue
                      scanned += 1
                      name = prefix + item.filename
                      try:
                          data = archive.read(item)
                      except Exception as exc:
                          print(f"Skipping {name}: {exc}")
                          continue
                      scan_bytes(data, name)
                      if data[:4] == b"PK\\x03\\x04":
                          try:
                              scan_archive(data, name + "!")
                          except BadZipFile:
                              pass

          try:
              scan_archive(Path("jerry.jar.jar").read_bytes())
          except BadZipFile:
              raise SystemExit("The release asset is not a readable JAR/ZIP archive.")

          print(f"Scanned {scanned} entries; extracted {count} unique PNGs.")
          with ZipFile("jerry_pngs.zip", "w", ZIP_DEFLATED) as out:
              for file in sorted(OUT.glob("*.png")):
                  out.write(file, file.name)
          PY

      - name: Upload PNG ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jerry-pngs
          path: jerry_pngs.zip
          if-no-files-found: error
          retention-days: 7
